name: Ruby SDK

on:
  push:
    branches:
      - main
    paths:
      - 'ruby-sdk/**'
      - 'eppo_core/**'
      - 'sdk-test-data'
      - 'mock-server/**'
      - 'package-lock.json'
      - 'package.json'
      - '.github/workflows/ruby.yml'
  pull_request:
    paths:
      - 'ruby-sdk/**'
      - 'eppo_core/**'
      - 'sdk-test-data'
      - 'mock-server/**'
      - 'package-lock.json'
      - 'package.json'
      - '.github/workflows/ruby.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruby_test:
    runs-on: ${{ matrix.os }}-latest
    env:
      # Ruby 3.2 built with GCC 15 (the ubuntu-26.04 image) has no HAVE_STDBOOL_H
      # in config.h (https://bugs.ruby-lang.org/issues/21340), and bindgen parses
      # the Ruby headers as gnu17, so `bool` is not defined. Include <stdbool.h>
      # first, as https://github.com/oxidize-rb/rb-sys/pull/814 does. Remove this
      # after an rb-sys release has that fix.
      BINDGEN_EXTRA_CLANG_ARGS: "-include stdbool.h"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos]
        # NOTE: these versions are only affecting CI check for
        # PRs. For prebuilt libraries in release, see ruby-release.yml.
        ruby:
          - "3.0"
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up Ruby & Rust
        uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: "${{ matrix.ruby }}"
          bundler-cache: true
          cargo-cache: true
          rubygems: '3.5.11'

      - run: npm ci

      - name: Override eppo_core for testing
        run: |
          mkdir -p ~/.cargo/
          echo "[patch.crates-io.eppo_core]" >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"
          echo "path = '$PWD/eppo_core'" >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"

      - name: Install dependencies
        run: bundle install
        working-directory: ruby-sdk

      - name: Build
        run: bundle exec rake build
        working-directory: ruby-sdk

      - name: Run tests
        run: npm run with-server test:ruby
